<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWall - Mis Contactos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Animación de pantalla */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-[100dvh] overflow-hidden md:h-screen md:overflow-auto opacity-0 transition-opacity duration-100 ease-in-out">
    
    <main class="w-full md:max-w-[380px] bg-[#f8fafc] md:rounded-[32px] p-6 md:shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col h-[100dvh] md:h-[820px] md:my-8 relative overflow-hidden">
        <div class="fade-in w-full h-full flex flex-col">
        <!-- Cabecera -->
        <header class="relative flex justify-between items-center pt-2 pb-4 shrink-0 z-10">
            <!-- Botón Volver -->
            <button id="btnVolver" class="w-10 h-10 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-slate-900 text-lg font-extrabold font-['Plus_Jakarta_Sans',sans-serif]">Mis <span class="text-blue-600">Contactos</span></span>
            </div>
            <div class="w-10 h-10"></div>
        </header>

        <!-- Barra de Búsqueda -->
        <div class="mt-2 mb-4 shrink-0">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400"></i>
                <input type="text" id="inputBusquedaContactos" placeholder="Buscar por nombre o alias..." class="w-full h-12 pl-11 pr-4 rounded-2xl border border-slate-200 bg-white text-xs font-semibold text-slate-700 outline-none focus:border-blue-500 transition-colors placeholder:font-medium placeholder:text-slate-400 shadow-sm">
            </div>
        </div>

        <!-- Botón Agregar Nuevo -->
        <button id="btnNuevoContacto" class="w-full bg-blue-50 border border-blue-100 border-dashed rounded-2xl p-4 flex items-center gap-4 hover:bg-blue-100/50 transition shrink-0 mb-4 cursor-pointer">
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shrink-0 shadow-sm">
                <i class="fa-solid fa-plus"></i>
            </div>
            <div class="flex flex-col text-left">
                <span class="text-sm font-bold text-blue-700">Agregar nuevo contacto</span>
                <span class="text-[10px] font-medium text-blue-500">Agendar CBU, CVU o Alias</span>
            </div>
        </button>

        <!-- Lista de Contactos -->
        <div class="flex-1 overflow-y-auto scrollbar-hide -mx-2 px-2 pb-24" id="contenedorListaContactos">
            
            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-1 mt-2">Guardados</h3>

            <!-- Contenedor dinámico de contactos -->
            <div id="listaItemsContactos" class="flex flex-col">
                <!-- Se inyectan dinámicamente con JavaScript -->
            </div>
            
            <!-- Mensaje Estado Vacío (Sin contactos) -->
            <div id="msgSinContactos" class="hidden flex flex-col items-center justify-center mt-10 opacity-70">
                <i class="fa-solid fa-address-book text-4xl text-slate-300 mb-3"></i>
                <span class="text-xs font-bold text-slate-400 text-center">Aún no tienes contactos agendados.</span>
            </div>

            <!-- Mensaje Estado Vacío (Búsqueda) -->
            <div id="msgSinResultados" class="hidden flex flex-col items-center justify-center mt-10 opacity-70">
                <i class="fa-solid fa-ghost text-4xl text-slate-300 mb-3"></i>
                <span class="text-xs font-bold text-slate-400 text-center">No encontramos contactos con ese nombre.</span>
            </div>

        </div>
        </div>

    </main>

    <!-- MODAL CONFIRMAR ELIMINACIÓN                -->

    <div id="modalEliminarContacto" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-white w-full max-w-[320px] md:rounded-[32px] p-6 md:shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center text-center" id="modalEliminarContactoContent">
            <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-2xl mb-4 border-4 border-white shadow-sm">
                <i class="fa-solid fa-trash-can"></i>
            </div>
            <h3 class="text-lg font-extrabold text-slate-900 mb-2">Eliminar Contacto</h3>
            <p class="text-sm font-medium text-slate-500 mb-6 leading-relaxed">¿Estás seguro que deseas eliminar a <strong id="nombreContactoAEliminar" class="text-slate-800"></strong> de tu agenda?</p>
            
            <div class="flex w-full gap-3">
                <button id="btnCancelarEliminar" class="flex-1 h-12 rounded-2xl bg-slate-100 text-slate-600 font-bold text-sm hover:bg-slate-200 transition">Cancelar</button>
                <button id="btnConfirmarEliminar" class="flex-1 h-12 rounded-2xl bg-red-500 text-white font-bold text-sm hover:bg-red-600 transition shadow-[0_4px_14px_0_rgba(239,68,68,0.39)]">Sí, eliminar</button>
            </div>
        </div>
    </div>


    <!-- MODAL NUEVA CUENTA (Igual que en Dashboard)-->

    <div id="modalNuevaCuenta" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full md:max-w-[380px] rounded-t-[32px] p-6 md:shadow-2xl transform translate-y-full transition-transform duration-300 flex flex-col" id="modalNuevaCuentaContent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-extrabold text-slate-900">Agendar Cuenta</h3>
                <button id="btnCerrarModalCuenta" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 block pl-1">Alias, CBU o CVU</label>
                    <input type="text" id="inputModalCbu" placeholder="Ej: mecanico.mp" class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 block pl-1">Nombre para agendar</label>
                    <input type="text" id="inputModalNombre" placeholder="Ej: Mecánico Juan" class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-colors">
                </div>
            </div>

            <button id="btnGuardarModalCuenta" class="w-full h-12 bg-blue-600 text-white rounded-2xl font-bold text-sm hover:bg-blue-700 transition shadow-md">
                Guardar Contacto
            </button>
        </div>
    </div>

    <script src="../fx.js"></script>
    <script src="srcContactos.js"></script>
    <script src="../menu/bottomNav.js"></script>
</body>
</html>
