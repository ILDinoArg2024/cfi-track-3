<!DOCTYPE html>
<html lang="es">
<head>

        body { font-family: 'Plus Jakarta Sans', sans-serif; }

</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 opacity-0 transition-opacity duration-100 ease-in-out">

    <main class="w-full max-w-[380px] bg-gradient-to-b from-[#f0f6ff] to-white rounded-[32px] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col items-center text-center my-8">
        
        <!-- Logo AlkyWall -->
        <div class="inline-flex justify-center items-center gap-3 mb-4 mt-2">
            <img src="../assets/logo.png" alt="AlkyWall Logo" class="w-10 h-10 object-contain drop-shadow-md">

                <span class="text-slate-900 text-xl font-extrabold">Alky</span><span class="text-blue-600 text-xl font-extrabold">Wall</span>

        </p>

        <!-- Botones de Acción -->
        <div class="w-full flex flex-col gap-3">
            <a id="btnIrInicio" href="../dashboard/indexDashboard.html" class="w-full h-12 bg-blue-600 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-700 transition shadow-md">
                <i class="fa-solid fa-house text-xs"></i>
                Ir al Inicio
            </a>
            <button onclick="window.history.back()" class="w-full h-12 bg-slate-100 text-slate-600 rounded-2xl font-bold text-sm hover:bg-slate-200 transition">
                Volver atrás
            </button>
        </div>

    </main>

    <script src="../fx.js"></script>
    <script src="src404.js"></script>

</html>
