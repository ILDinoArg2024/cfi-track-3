<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWall - Mi Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Animación de pantalla */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-[100dvh] overflow-hidden md:h-screen md:overflow-auto opacity-0 transition-opacity duration-100 ease-in-out">
    <main class="w-full md:max-w-[380px] bg-gradient-to-b from-[#f0f6ff] to-white md:rounded-[32px] p-6 md:shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col h-[100dvh] md:h-[820px] md:my-8 relative overflow-hidden">
        <div class="fade-in w-full h-full flex flex-col overflow-y-auto scrollbar-hide">
        <!-- Cabecera -->
        <header class="relative flex justify-between items-center pt-2 pb-6">
            <button id="open-menu-btn" class="w-10 h-10 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-slate-900 text-lg font-extrabold font-['Plus_Jakarta_Sans',sans-serif]">Mi <span class="text-blue-600">Perfil</span></span>
            </div>
        </header>

        <!-- avatar -->
        <div class="flex flex-col items-center mt-2 mb-8">
            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-600 to-blue-400 p-1 shadow-lg mb-4">
                <div class="w-full h-full rounded-full bg-white flex items-center justify-center border-4 border-white">
                    <span id="inicialesUsuario" class="text-3xl font-extrabold text-blue-600">FC</span>
                </div>
            </div>
            <h2 id="nombreUsuario" class="text-2xl font-bold text-slate-900 tracking-tight"></h2>
            <p id="emailUsuario" class="text-sm font-medium text-slate-500 mt-1"></p>
            <div class="mt-3 bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border border-blue-100 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i> Cuenta Verificada
            </div>
        </div>

        <!-- Datos Bancarios-->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Datos de la cuenta</h3>
            <div class="bg-white rounded-[20px] border border-slate-200 shadow-sm overflow-hidden">
                
                <!-- CVU -->
                <div id="rowCVU" class="p-4 border-b border-slate-100 flex justify-between items-center hover:bg-slate-50 transition cursor-pointer group">
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">CVU</span>
                        <span id="cvuUsuario" class="text-sm font-semibold text-slate-700 font-mono tracking-tight"></span>
                    </div>
                    <button id="btnCopiarCVU" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-blue-600 hover:bg-blue-100 transition" title="Copiar CVU">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <!-- Alias -->
                <div id="rowAlias" class="p-4 flex justify-between items-center hover:bg-slate-50 transition cursor-pointer group">
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Alias</span>
                        <span id="aliasUsuario" class="text-sm font-semibold text-slate-700 font-mono"></span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button id="btnCopiarAlias" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-blue-600 hover:bg-blue-100 transition" title="Copiar Alias">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <a href="../configuracion/indexConfiguracion.html" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-blue-50 hover:text-blue-600 transition" title="Editar Alias en Configuración">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Datos Personales -->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Información Personal</h3>
            <div class="bg-white rounded-[20px] border border-slate-200 shadow-sm overflow-hidden">
                
                <!-- DNI -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-500">
                            <i class="fa-regular fa-id-card text-sm"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-600">DNI</span>
                    </div>
                    <span id="dniUsuario" class="text-sm font-semibold text-slate-900"></span>
                </div>

                <!-- Teléfono -->
                <!-- <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-500">
                            <i class="fa-solid fa-mobile-screen-button text-sm"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-600">Teléfono</span>
                    </div>
                    <span id="telefonoUsuario" class="text-sm font-semibold text-slate-900">+54 2920 xxx-xxx</span>
                </div> -->

            </div>
        </div>
        </div>

        <!-- Toast Copiado Flotante -->
        <div id="toastCopiar" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-sm text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-green-400 text-sm"></i>
            <span>¡Copiado al portapapeles!</span>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../fx.js"></script>
    <script src="../menu/menu.js"></script>
    <script src="../menu/bottomNav.js"></script>
    <script src="srcPerfil.js"></script>

</body>
</html>
