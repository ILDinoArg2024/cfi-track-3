<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWall - Historial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Animación de pantalla */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center h-[100dvh] overflow-hidden md:h-screen md:overflow-auto opacity-0 transition-opacity duration-100 ease-in-out">
    
    <main class="w-full md:max-w-[380px] bg-[#f8fafc] md:rounded-[32px] p-6 md:shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col h-[100dvh] md:h-[820px] md:my-8 relative overflow-hidden">
        <div class="fade-in w-full h-full flex flex-col">
        <!-- Cabecera -->
        <header class="relative flex justify-between items-center pt-2 pb-6 shrink-0">
            <!-- Botón Volver -->
            <button id="btnVolver" class="w-10 h-10 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-slate-900 text-lg font-extrabold">Historial</span>
            </div>
            <div class="w-10 h-10"></div>
        </header>

        <!-- Filtros -->
        <div class="flex gap-2 mb-6 shrink-0 overflow-x-auto scrollbar-hide pb-2 -mx-2 px-2" id="contenedorFiltros">
            <button class="filtro-btn activo px-4 py-2 bg-slate-900 text-white rounded-xl text-[10px] font-bold shrink-0 shadow-md transition-colors" data-filtro="todos">Todos</button>
            <button class="filtro-btn px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-[10px] font-bold shrink-0 hover:bg-slate-50 transition-colors" data-filtro="ingresos">Ingresos</button>
            <button class="filtro-btn px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-xl text-[10px] font-bold shrink-0 hover:bg-slate-50 transition-colors" data-filtro="egresos">Egresos</button>
        </div>

        <!-- Lista de Movimientos -->
        <div class="flex-1 overflow-y-auto scrollbar-hide -mx-2 px-2 pb-6 flex flex-col gap-3" id="listaMovimientos">
            <!-- Los movimientos se inyectan acá desde JS -->
        </div>

        <!-- Mensaje de estado vacío (Se oculta si hay datos) -->
        <div id="msgHistorialVacio" class="hidden flex-col items-center justify-center h-full opacity-60">
            <div class="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center text-slate-400 text-2xl mb-4">
                <i class="fa-solid fa-receipt"></i>
            </div>
            <p class="text-sm font-bold text-slate-500">No hay operaciones actualmente.</p>
        </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../fx.js"></script>
    <script type="module" src="srcHistorial.js"></script>
</body>
</html>
